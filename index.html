<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d2127; --panel:#272c34; --line:#363c46; --text:#eceff3; --mute:#9aa3b0;
  --light:#FFFDF5; --dark:#F0C93F; --accent:#F0C93F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Schibsted Grotesk",system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:auto minmax(300px,380px);gap:20px;justify-content:center;padding:20px;align-items:start}
@media(max-width:980px){.app{grid-template-columns:minmax(0,1fr);padding:12px;gap:12px}}
html,body{overflow-x:hidden}
.app>*,.side,.col,.card{min-width:0}
.boardwrap{max-width:100%}
details.card>summary{cursor:pointer;font-size:13px;color:var(--mute);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";transition:transform .2s}
details.card:not([open])>summary::after{transform:rotate(-90deg)}
details.card[open]>summary{margin-bottom:8px}
@media(max-width:560px){textarea{height:72px}.controls button{padding:10px 0}}
.boardwrap{display:flex;gap:10px;align-items:stretch}
.evalbar{width:26px;border-radius:5px;overflow:hidden;background:#1a1a1a;position:relative;flex:none}
.evalbar .white{position:absolute;left:0;right:0;bottom:0;background:#fff;height:50%;transition:height .35s ease}
.evalbar.flip .white{bottom:auto;top:0}
.evalbar span{position:absolute;left:0;right:0;font-size:10px;font-weight:700;text-align:center;padding:3px 0}
.evalbar .top{top:0;color:#ddd}.evalbar .bot{bottom:0;color:#222}
.evalbar.flip .top{top:auto;bottom:0;color:#222}.evalbar.flip .bot{bottom:auto;top:0;color:#ddd}
.col{display:flex;flex-direction:column;gap:8px}
.board{--size:min(calc(100vw - 70px),640px);width:var(--size);height:var(--size);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:4px;position:relative;margin-top:6px}
.sq{position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq .hl{position:absolute;inset:0;opacity:.75}
.sq img.pc{position:absolute;inset:0;width:100%;height:100%;z-index:2;user-select:none;-webkit-user-drag:none}
.sq .pc-fb{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--size)/10);z-index:2}
.sq .co{position:absolute;font-size:10px;font-weight:700;z-index:1}
.sq.l .co{color:var(--co-l,#6b5a14)}.sq.d .co{color:var(--co-d,#6b5a14)}
.sq .co.r{top:2px;left:3px}.sq .co.f{bottom:1px;right:3px}
.badge{position:absolute;z-index:6;width:42%;height:42%;right:-14%;top:-14%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.badge img{width:100%;height:100%;display:block}
.badge i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font:700 calc(var(--size)/36)/1 "Schibsted Grotesk",sans-serif;font-style:normal;color:#fff;border:2px solid #fff}
.verdict{min-height:42px;font-size:15px;padding:8px 12px;background:var(--panel);border-radius:6px;display:flex;gap:10px;align-items:center}
.verdict img{width:26px;height:26px}
.verdict b{font-weight:700}
.controls{display:flex;gap:6px}
button{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.badge.pop{animation:pop .32s cubic-bezier(.3,1.4,.5,1) both}
.hl.fade{animation:fadein .35s ease both}
.verdict.rise{animation:rise .25s ease both}
.line{animation:fadein .25s ease both}
.sq img.pc.sliding{z-index:8;transition:transform .2s cubic-bezier(.3,.7,.3,1);will-change:transform}
.mvbtn{transition:background .15s}
.evalbar .white{transition:height .5s cubic-bezier(.3,.7,.3,1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button.primary{background:var(--accent);color:var(--on-accent,#2a2200);border-color:var(--accent);font-weight:700}
.controls button{flex:1;font-size:18px;padding:6px}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:8px;padding:12px}
h2{font-size:13px;margin:0 0 8px;color:var(--mute);font-weight:500}
textarea{width:100%;height:92px;resize:vertical;background:var(--input,#1b1f25);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.row{display:flex;gap:8px 12px;margin-top:8px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:var(--mute);flex:1;min-width:120px}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent);transition:width .2s}
#lines{min-height:132px}
.sel{font:inherit;font-size:12px;background:var(--input,#1b1f25);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px}
label{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.line{display:flex;gap:8px;padding:5px 0;font-size:13px;border-top:1px solid var(--line);align-items:baseline}
.line:first-of-type{border-top:0}
.line .ev{flex:none;min-width:48px;text-align:center;font-weight:700;border-radius:4px;padding:2px 4px;font-size:12px}
.line .ev.w{background:#fff;color:#222}.line .ev.b{background:#111;color:#fff}
.line .mv{display:flex;flex-wrap:wrap;gap:2px 6px}
.line .mv span{cursor:pointer;border-radius:3px;padding:0 2px}
.line .mv span:hover{background:var(--line)}
.line .mv .n{color:var(--mute);cursor:default}.line .mv .n:hover{background:none}
.moves{position:relative;max-height:300px;overflow:auto;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px;font-size:14px}
.moves .num{color:var(--mute);padding:5px 0;font-size:12px}
.mvbtn{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:4px;cursor:pointer;min-height:28px}
.mvbtn:hover{background:var(--line)}
.mvbtn.on{background:var(--accent);color:var(--on-accent,#2a2200);font-weight:700}
.mvbtn img,.mvbtn i{width:16px;height:16px;flex:none}
.mvbtn i{border-radius:50%;display:grid;place-items:center;font:700 9px/1 sans-serif;font-style:normal;color:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:3px 4px;text-align:center;font-weight:400}
td:first-child{text-align:left}
td img,td i.ic{width:16px;height:16px;vertical-align:middle;margin-right:5px;display:inline-block;border-radius:50%}
.themes{display:flex;flex-wrap:wrap;gap:10px}
.theme{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;background:none;border:2px solid transparent;border-radius:8px;font-size:11px;color:var(--mute)}
.theme.on{border-color:var(--accent);color:var(--text)}
.theme .sw{width:40px;height:40px;border-radius:5px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.theme .sw i{display:block}
.theme .sw i:nth-child(1),.theme .sw i:nth-child(4){background:var(--a)}
.theme .sw i:nth-child(2),.theme .sw i:nth-child(3){background:var(--b)}
.custom{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.custom label{gap:8px}
.custom input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer}
.mvbtn{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mvbtn.edited::after{content:"";margin-left:auto;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.ctx{position:fixed;z-index:100;min-width:190px;max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.ctx[hidden]{display:none}
.ctx-h{font-size:11px;color:var(--mute);padding:6px 10px 4px}
.ctx-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:5px;font-size:14px}
.ctx-i:hover,.ctx-i:focus-visible{background:var(--line)}
.ctx-i.on{background:var(--line);font-weight:700}
.hint{font-size:11px;color:var(--mute);margin-top:6px}
.board{box-sizing:border-box;border:var(--bw,0px) solid var(--frame,transparent);background:var(--frame,transparent);border-radius:6px}
.sq{cursor:pointer;touch-action:manipulation}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(20,110,255,.35);z-index:1}
.sq.dot::after{content:"";position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:rgba(0,0,0,.25);z-index:3;pointer-events:none}
.sq.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:max(3px,.5vw) solid rgba(0,0,0,.28);z-index:3;pointer-events:none}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.hd h2{margin:0}
.mini{padding:3px 9px;font-size:12px}
.var{margin-top:8px;padding:6px 8px;border-left:3px solid var(--accent);background:rgba(127,127,127,.09);border-radius:0 6px 6px 0}
.var-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mute);margin-bottom:4px}
.var-h button{padding:0 8px;font-size:15px;line-height:20px}
.var-m{display:flex;flex-wrap:wrap;gap:2px}
.var-m .mvbtn{padding:3px 6px;min-height:24px}
.vn{color:var(--mute);font-size:12px;margin-right:2px}
.mvbtn.on .vn{color:inherit}
.mini[hidden]{display:none}
.cp{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line);background:var(--c,#fff);box-shadow:inset 0 0 0 2px var(--panel);flex:none}
.cp:hover{border-color:var(--accent)}
.cpop{position:fixed;z-index:120;width:224px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.55)}
.cpop[hidden]{display:none}
.wheel{position:relative;width:200px;height:200px;margin:0 auto;border-radius:50%;cursor:crosshair;touch-action:none;
  background:radial-gradient(circle closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:0 0 0 3px var(--line)}
.wheel::after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;opacity:var(--dim,0);pointer-events:none}
.knob{position:absolute;z-index:2;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.cprange{-webkit-appearance:none;appearance:none;width:100%;height:16px;margin:14px 0 4px;border-radius:8px;background:linear-gradient(90deg,#000,var(--top,#fff));outline:none;touch-action:none}
.cprange::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}
.cprange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
.cprow{display:flex;align-items:center;gap:8px;margin-top:10px}
.cpprev{width:30px;height:30px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 0 2px var(--line);flex:none}
.cphex{flex:1;min-width:0;font:13px ui-monospace,Menlo,monospace;text-transform:uppercase;background:var(--input,#1b1f25);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.accs{display:flex;gap:10px;justify-content:space-around;margin-bottom:10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;flex:1}
.gauge svg{display:block;color:var(--text)}
.gauge .gn{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gauge .gs{font-size:11px;color:var(--mute)}
#graph{display:block;width:100%;height:auto;border-radius:6px;cursor:pointer;margin:2px 0 10px}
.sub{font-size:11px;color:var(--mute);margin:14px 0 6px;font-weight:500}
#themeCard .themes{gap:6px}
</style>
</head>
<body>
<div class="app">
  <div class="col">
    <div class="boardwrap">
      <div class="evalbar" id="evalbar"><div class="white" id="evalwhite"></div><span class="top" id="evtop"></span><span class="bot" id="evbot"></span></div>
      <div class="col">
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="controls">
          <button id="bStart" title="Start">⏮</button><button id="bPrev" title="Previous (←)">◀</button>
          <button id="bNext" title="Next (→)">▶</button><button id="bEnd" title="End">⏭</button>
          <button id="bFlip" title="Flip board (F)">⇅</button>
        </div>
        <div class="verdict" id="verdict">Paste a PGN and press Analyze. Chess.com and Lichess exports work as-is.</div>
      </div>
    </div>
  </div>

  <div class="side">
    <details class="card" id="pgnCard" open>
      <summary>PGN &amp; settings</summary>
      <textarea id="pgn" spellcheck="false"></textarea>
      <div class="row">
        <label>Depth <select class="sel" id="selDepth"><option value="10">Fast</option><option value="14" selected>Normal</option><option value="16">Deep</option><option value="20">Max</option></select></label>
        <label>Engines <select class="sel" id="selWorkers"><option value="0" selected>Auto</option><option value="1">1</option><option value="2">2</option><option value="4">4</option><option value="6">6</option></select></label>
        <label title="Reuse the engine's own lines when the played move is one of its suggestions, so fewer positions need a fresh search"><input type="checkbox" id="chkPartial" checked> Partial analysis</label>
        <label>Strictness <select class="sel" id="selStrict"><option value="1.5">Lenient</option><option value="1" selected>Normal</option><option value="0.7">Strict</option></select></label>
        <label title="WebAssembly Stockfish is several times faster. If it can't load, the classic JavaScript engine is used automatically">Engine <select class="sel" id="selEngine"><option value="auto" selected>WASM (fast)</option><option value="asm">Classic (JS)</option></select></label>
        <label title="When the analysis is done, search the whole game again one depth deeper, over and over, re-classifying after every pass"><input type="checkbox" id="chkDeepen" checked> Keep deepening</label>
        <label>up to depth <select class="sel" id="selMax"><option value="16">16</option><option value="18">18</option><option value="20" selected>20</option><option value="24">24</option><option value="30">30</option></select></label>
      </div>
      </details>
    <details class="card" id="themeCard">
      <summary>Appearance</summary>
      <div class="sub">Website</div><div class="themes" id="siteThemes" role="radiogroup" aria-label="Website theme"></div>
      <div class="custom"><label>Accent <button type="button" class="cp" id="colAccent" aria-label="Accent colour"></button></label><button type="button" class="mini" id="bResetAccent">Reset</button></div>
      <div class="sub">Board colours</div><div class="themes" id="themes" role="radiogroup" aria-label="Board theme"></div>
      <div class="custom" id="customRow" hidden>
        <label>Light squares <button type="button" class="cp" id="colLight" aria-label="Light square colour"></button></label>
        <label>Dark squares <button type="button" class="cp" id="colDark" aria-label="Dark square colour"></button></label>
      </div>
      <div class="sub">Pieces</div>
      <div class="row" style="margin-top:0"><select class="sel" id="selPieces" aria-label="Piece set"></select><span id="piecePrev" style="display:flex"></span></div>
      <div class="sub">Board border</div><div class="themes" id="borders" role="radiogroup" aria-label="Board border"></div>
      <div class="custom" id="borderRow" hidden><label>Border colour <button type="button" class="cp" id="colBorder" aria-label="Border colour"></button></label></div>
    </details>
    <div class="card">
      <div class="row">
        <button class="primary" id="bAnalyze">Analyze game</button>
        <div class="status" id="status">Loading engine…</div>
      </div>
      <div class="progress"><div id="prog"></div></div>
    </div>

    <div class="card">
      <div class="hd"><h2 id="linesTitle">Engine lines</h2><button type="button" class="mini" id="bPause" hidden> Pause</button></div>
      <div id="lines"></div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
      <div id="vars"></div>
    </div>

    <div class="card" id="summaryCard" hidden>
      <h2>Game review</h2>
      <div class="accs" id="acc"></div>
      <svg id="graph" viewBox="0 0 300 70" role="img" aria-label="Evaluation graph. Click to jump to a move."></svg>
      <table id="summary"></table>
    </div>
  </div>
</div>

<div class="cpop" id="cpop" hidden>
  <div class="wheel" id="cpWheel"><div class="knob" id="cpKnob"></div></div>
  <input type="range" class="cprange" id="cpVal" min="0" max="100" step="1" aria-label="Brightness">
  <div class="cprow"><span class="cpprev" id="cpPrev"></span><input class="cphex" id="cpHex" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour"><button type="button" class="mini" id="cpDone">Done</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
/* ---------- Config ---------- */
let PIECE_SET = 'cburnett'; // any set in lichess-org/lila public/piece
const PIECE_URL = (c,p)=>`https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/${PIECE_SET}/${c}${p}.svg`;
const ICON_FILE = {miss:'missed'};   // the image for "miss" is missed.png
const ICON_URL  = k=>`/images/moves/${ICON_FILE[k]||k.toLowerCase()}.png`;
const ENGINE_URL = 'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js';   // classic asm.js engine (automatic fallback)
// Stockfish 18 "lite" compiled to WebAssembly: single-threaded, needs no special server headers, about 7 MB
const WASM_BASES = ['https://cdn.jsdelivr.net/npm/stockfish@18.0.8/bin/','https://cdn.jsdelivr.net/npm/stockfish@18.0.8/src/'];
const WASM_JS = 'stockfish-18-lite-single.js', WASM_BIN = 'stockfish-18-lite-single.wasm';
const MULTIPV = 3;
const OPENINGS_URL = 'openings.txt';  // tab-separated: eco, name, pgn, uci, epd (put it next to index.html)

const CLS = {
  brilliant:  {label:'Brilliant',  color:'#26C2A3', sym:'!!'},
  great:      {label:'Great',      color:'#749BBF', sym:'!'},
  best:       {label:'Best',       color:'#81B64C', sym:'★'},
  excellent:  {label:'Excellent',  color:'#81B64C', sym:'✓'},
  good:       {label:'Good',       color:'#C6E8A0', sym:'✓'},
  inaccuracy: {label:'Inaccuracy', color:'#F7C631', sym:'?!'},
  miss:       {label:'Miss',       color:'#FF7769', sym:'×'},
  mistake:    {label:'Mistake',    color:'#FFAE64', sym:'?'},
  blunder:    {label:'Blunder',    color:'#FB4834', sym:'??'},
  book:       {label:'Book',       color:'#D5A47D', sym:'B'},
  forced:     {label:'Forced',     color:'#81B64C', sym:'→'},
};
const ORDER=['brilliant','great','best','excellent','good','book','forced','inaccuracy','miss','mistake','blunder'];

/* Small opening book (SAN prefixes). A move is "book" while the game follows one of these lines. */
const BOOK = `e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3
e4 e5 Nf3 Nc6 Bb5 Nf6 O-O Nxe4 d4 Nd6 Bxc6 dxc6 dxe5 Nf5 Qxd8+ Kxd8
e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O a6
e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5 Bb5+ c6 dxc6 bxc6 Be2 h6
e4 e5 Nf3 Nc6 d4 exd4 Nxd4 Nf6 Nxc6 bxc6 e5 Qe7 Qe2 Nd5 c4 Ba6
e4 e5 Nf3 Nf6 Nxe5 d6 Nf3 Nxe4 d4 d5 Bd3 Nc6 O-O Be7
e4 e5 Nf3 d6 d4 Bg4 dxe5 Bxf3 Qxf3 dxe5 Bc4 Nf6 Qb3 Qe7 Nc3 c6 Bg5 b5
e4 e5 Nc3 Nf6 f4 d5 fxe5 Nxe4 Nf3 Be7
e4 e5 f4 exf4 Nf3 g5 h4 g4 Ne5 Nf6 Bc4 d5 exd5 Bd6 d4 Nh5 Nc3
e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O
e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 Nc3 Bg7 Be3 Nf6 Bc4 O-O Bb3 d6 f3
e4 c5 Nf3 e6 d4 cxd4 Nxd4 Nc6 Nc3 Qc7 Be3 a6 Be2 Nf6 O-O Bb4

/* ---------- Engine pool ----------
   Engines run single-threaded, so "more threads" = several engine workers analysing different parts of the
   game at once. The WebAssembly build is tried first; if it can't start (offline, blocked CDN, old browser)
   the classic asm.js engine takes over automatically. */
const POOL=[];
const ENG={wasmOK:null,probe:null,fetching:null};
function getWasm(){   // download the .wasm once, shared by every worker
  return ENG.fetching||(ENG.fetching=(async()=>{
    for(const base of WASM_BASES){
      try{const r=await fetch(base+WASM_BIN);if(r.ok)return{base,bytes:await r.arrayBuffer()}}catch(e){}
    }
    throw new Error('could not download it');
  })().catch(e=>{ENG.fetching=null;throw e}));
}
class Engine{
  constructor(){
    this.busy=null;this.pending=null;this.ready=false;this.uci=false;this.failed=null;this.dead=false;this.label='';this.w=null;
    this.readyP=new Promise(r=>{this._ready=r});
    this.boot();
  }
  async boot(){
    if($('selEngine').value!=='asm'){
      if(ENG.probe)await ENG.probe.catch(()=>{});          // workers created together wait for the first one's verdict
      if(this.dead)return;
      if(ENG.wasmOK!==false){
        const p=this.bootWasm();if(!ENG.probe)ENG.probe=p;
        try{await p;return}
        catch(e){
          if(this.dead)return;
          ENG.wasmOK=false;this.drop();
          setStatus('WASM engine could not start ('+((e&&e.message)||e)+'). Using the classic engine…');
        }
      }
    }
    if(!this.dead)this.bootAsm();
  }
  attach(w){this.w=w;w.onmessage=ev=>this.onMsg(typeof ev.data==='string'?ev.data:'')}
  drop(){try{if(this.w)this.w.terminate()}catch(e){}this.w=null;this.busy=null;this.pending=null;this.ready=false;this.uci=false;this.failed=null}
  kill(){this.dead=true;this.drop()}
  async bootWasm(){
    setStatus('Loading WASM engine…');
    const {base,bytes}=await getWasm();
    if(this.dead)return;
    // The worker is a blob (cross-origin scripts can't be Workers), so hand it the .wasm bytes and tell Emscripten where things live.
    const code='self.onmessage=function(e){var d=e.data;if(!d||!d.__init||self.__go)return;self.__go=1;'+
      'self.Module={wasmBinary:d.wasm,locateFile:function(p){return d.base+p}};importScripts(d.base+d.js)};';
    const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
    let w;
    try{w=new Worker(url+'#'+base+WASM_BIN)}catch(e){w=new Worker(url)}   // some builds read the .wasm location from the hash
    this.attach(w);this.label='WASM';
    w.onerror=ev=>{this.failed=(ev&&ev.message)||'worker error';if(ev&&ev.preventDefault)ev.preventDefault()};
    const copy=bytes.slice(0);
    w.postMessage({__init:1,wasm:copy,base,js:WASM_JS},[copy]);
    const t0=Date.now();
    while(!this.ready){                                     // keep asking until the engine has finished starting up
      if(this.dead)return;
      if(this.failed)throw new Error(this.failed);
      if(Date.now()-t0>30000)throw new Error('timed out');
      if(!this.uci&&this.w)this.w.postMessage('uci');
      await new Promise(r=>setTimeout(r,400));
    }
    ENG.wasmOK=true;
  }
  bootAsm(){
    try{
      const blob=new Blob([`importScripts("${ENGINE_URL}");`],{type:'application/javascript'});
      this.attach(new Worker(URL.createObjectURL(blob)));
    }catch(err){setStatus('Engine failed to start: '+err.message);return}
    this.label='classic';
    this.w.onerror=()=>setStatus('Engine error. Check your connection and reload.');
    this.send('uci');
  }
  send(c){if(this.w)this.w.postMessage(c)}
  onMsg(line){
    if(line==='uciok'&&!this.uci){
      this.uci=true;
      this.send('setoption name MultiPV value '+MULTIPV);
      this.send('setoption name Hash value '+(this.label==='WASM'?32:16));
      this.send('isready');
    }else if(line==='readyok'&&!this.ready){
      this.ready=true;this._ready();
      if(!S.batch&&!S.deep&&POOL.every(e=>e.ready))setStatus('Engine ready ('+this.label+(POOL.length>1?`, ${POOL.length} workers`:'')+').');
    }else if(line.startsWith('info')&&line.includes(' pv ')&&this.busy){
      if(/ (lower|upper)bound/.test(line))return;
      const j=this.busy,m=line.match(/multipv (\d+)/),k=m?+m[1]:1;
      const sc=line.match(/score (cp|mate) (-?\d+)/);if(!sc)return;
      const sign=j.turn==='w'?1:-1,raw=+sc[2];
      let v,mate=null;
      if(sc[1]==='mate'){mate=sign*raw;v=(raw>0?1:-1)*sign*(50-Math.min(Math.abs(raw),49))}
      else v=sign*raw/100;
      j.lines[k]={v,mate,pv:line.split(' pv ')[1].trim().split(' '),depth:+(line.match(/depth (\d+)/)||[0,0])[1]};
      if(j.onInfo)j.onInfo(arr(j));
    }else if(line.startsWith('bestmove')&&this.busy){
      const j=this.busy;this.busy=null;
      j.res({lines:arr(j),stopped:j.stopped});
      if(this.pending){const p=this.pending;this.pending=null;this.start(p)}
    }
  }
  halt(){if(this.pending){this.pending.res({lines:[],stopped:true});this.pending=null}if(this.busy){this.busy.stopped=true;this.send('stop')}}
  start(j){this.busy=j;this.send('position fen '+j.fen);this.send('go depth '+j.depth)}
  search(fen,depth,onInfo){
    return new Promise(res=>{
      const j={fen,depth,onInfo,res,lines:{},turn:fen.split(' ')[1],stopped:false};
      if(this.busy){
        if(this.pending)this.pending.res({lines:[],stopped:true});
        this.pending=j;this.busy.stopped=true;this.send('stop');
      }else this.start(j);
    });
  }
}
const arr=j=>Object.keys(j.lines).sort((a,b)=>a-b).map(k=>j.lines[k]);
function getPool(n){while(POOL.length<n)POOL.push(new Engine());return POOL.slice(0,n)}
function workerCount(){
  const v=+$('selWorkers').value;if(v)return v;
  return Math.max(1,Math.min(4,(navigator.hardwareConcurrency||4)-1));
}
function terminal(fen){
  const c=new Chess(fen);
  if(c.in_checkmate())return[{v:c.turn()==='w'?-50:50,mate:0,pv:[]}];
  if(c.game_over())return[{v:0,mate:null,pv:[]}];
  return null;
}

function fmt(l){
  if(!l)return'';
  if(l.mate!==null&&l.mate!==undefined)return l.mate===0?'#':(l.mate>0?'#':'-#')+Math.abs(l.mate);
  return(l.v>0?'+':'')+l.v.toFixed(1);

function pvToSan(fen,pv,max=9){
  const c=new Chess(fen),out=[];
  for(const u of pv.slice(0,max)){
    const mv=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});
    if(!mv)break;
    out.push({san:mv.san,fen:c.fen(),from:mv.from,to:mv.to,color:mv.color,num:c.history().length});
  }
  return out;
}

/* ---------- Opening book (openings.txt) ----------
   A move is "book" while the game stays inside the openings file. Three lookups, cheapest first:
   exact move path (names a line), position (handles transpositions), and path prefix (the unnamed
   moves along the way to a named line). The last name seen is kept as the current opening. */
const OPEN={path:new Map(),pos:new Map(),pre:new Set(),ok:false,p:null};
const epdKey=f=>f.split(' ').slice(0,3).join(' ');   // board, turn, castling (en-passant field differs between tools)
function loadOpenings(){
  if(OPEN.p)return OPEN.p;
  return OPEN.p=fetch(OPENINGS_URL).then(r=>{if(!r.ok)throw new Error('openings '+r.status);return r.text()}).then(txt=>{
    for(const raw of txt.split('\n')){
      const c=raw.replace(/\r$/,'').split('\t');
      if(c.length<5||c[0]==='eco')continue;
      const uci=c[3].trim().split(' '),hit={eco:c[0],name:c[1]};
      OPEN.path.set(uci.join(' '),hit);
      if(!OPEN.pos.has(epdKey(c[4])))OPEN.pos.set(epdKey(c[4]),hit);
      for(let k=1;k<=uci.length;k++)OPEN.pre.add(uci.slice(0,k).join(' '));
    }
    OPEN.ok=OPEN.path.size>0;
  }).catch(()=>{OPEN.ok=false});
}
async function fetchBook(L=S.line){
  L.book=null;S.bookSrc='local';
  if(L.startFen)return;
  await loadOpenings();
  if(!OPEN.ok)return;                  // file missing: fall back to the small built-in list
  computeBook(L);S.bookSrc='openings';
}
function computeBook(L){
  if(L.startFen||!OPEN.ok)return;
  const out=[],path=[];let name=null;
  for(let i=1;i<=L.moves.length;i++){
    path.push(uciOf(L.moves[i-1]));
    const key=path.join(' '),hit=OPEN.path.get(key)||OPEN.pos.get(epdKey(L.fens[i]));
    if(hit)name=hit.eco+' '+hit.name;
    const book=!!hit||OPEN.pre.has(key);
    out[i]={book,opening:name};
    if(!book)break;                    // left theory
  }
  L.book=out;
}

/* ---------- Classification ----------
   Based on the WintrChess method (WintrCat/wintrchess): expected-points loss for move quality,
   plus separate "critical" (shown here as Great) and Brilliant checks.
   Mapping: Okay = Good, Critical = Great. All numbers are tunable in CFG. */
const CFG={
  depth:12, strict:1, partial:true,
  loss:{best:.01,excellent:.045,good:.08,inacc:.12,mistake:.22},  // expected points lost
  greatGap:.1,          // 2nd-best line must lose at least this many expected points
  overwhelming:7,       // 2nd-best line already above +7 -> not critical / brilliant
  brillMinEval:.5,      // a brilliant move must leave you at least this far ahead (pawns)
  leniency:true,        // top-3 engine move that still leaves you better is Excellent at worst
  keepAdv:.3,
  missBefore:1, missAfter:.7, missLow:-.5,
  // material counting + extra checks
  brillSac:2,           // a brilliant move must give up at least this much material once all captures are played out (trades don't count)
  brillMaxBefore:5,     // ...and you must not already be crushing (pawns)
  rescue:true,          // Great: the only move that turns a lost position into a holdable one
  rescueBefore:-1.5, rescueAfter:-.3, rescueAlt:-1,
  missMate:true,        // Miss: a forced mate was available and the move let it go
  missHung:true,        // Miss: the opponent left material hanging and it wasn't collected
  decisive:true,        // keeping a decisive advantage is never worse than Good
  decisiveFrom:6, decisiveKeep:5,
  deepen:true, maxDepth:20,
};
const PV={p:1,n:3,b:3,r:5,q:9,k:100};
const EP_GRADIENT=.0035;

/* expected points (white's perspective) */
function epWhite(l){
  if(l.mate!==null&&l.mate!==undefined){
    if(l.mate===0)return l.v>0?1:0;             // checkmate on the board
    return l.mate>0?1:0;
  }
  return 1/(1+Math.exp(-EP_GRADIENT*l.v*100));
}
const epMover=(l,sg)=>sg>0?epWhite(l):1-epWhite(l);

/* ---- board helpers (chess.js has no attacker API, so use legal captures with the turn flipped) ---- */
function withTurn(fen,color){const f=fen.split(' ');f[1]=color;f[3]='-';return f.join(' ')}
function movesFor(fen,color){try{return new Chess(withTurn(fen,color)).moves({verbose:true})}catch(e){return[]}}
const capsOn=(fen,sq,by)=>movesFor(fen,by).filter(m=>m.to===sq&&m.captured&&m.captured!=='k');
function defenderCount(fen,sq,color){
  try{
    const c=new Chess(withTurn(fen,color));c.remove(sq);
    c.put({type:'n',color:color==='w'?'b':'w'},sq);
    return c.moves({verbose:true}).filter(m=>m.to===sq&&m.captured).length;
  }catch(e){return 0}
}
// Non-pawn, non-king pieces that can be won: attacked by something cheaper, or attacked and undefended.
function unsafePieces(fen,color){
  const opp=color==='w'?'b':'w',out=[],b=new Chess(fen).board();
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const p=b[r][f];if(!p||p.color!==color||p.type==='p'||p.type==='k')continue;
    const sq='abcdefgh'[f]+(8-r),at=capsOn(fen,sq,opp);if(!at.length)continue;
    const cheapest=Math.min(...at.map(m=>PV[m.piece]));
    if(cheapest<PV[p.type]||defenderCount(fen,sq,color)===0)out.push({square:sq,type:p.type,color});
  }
  return out;
}
// Counterthreat: after the opponent takes it with their cheapest piece, can we win back as much as it was worth?
function regained(fen,u){
  const opp=u.color==='w'?'b':'w',at=capsOn(fen,u.square,opp);if(!at.length)return 0;
  at.sort((a,b)=>PV[a.piece]-PV[b.piece]);
  try{
    const c=new Chess(withTurn(fen,opp));
    if(!c.move({from:at[0].from,to:at[0].to,promotion:at[0].promotion}))return 0;
    return Math.max(0,...c.moves({verbose:true}).filter(m=>m.captured&&m.captured!=='k').map(m=>PV[m.captured]));
  }catch(e){return 0}
}
// Trapped: an unsafe piece with no square it can reach safely.
function isTrapped(fen,u){
  const ms=movesFor(fen,u.color).filter(m=>m.from===u.square);
  if(!ms.length)return true;
  return ms.every(m=>{
    try{
      const c=new Chess(withTurn(fen,u.color));
      if(!c.move({from:m.from,to:m.to,promotion:m.promotion}))return true;
      return unsafePieces(c.fen(),u.color).some(x=>x.square===m.to);
    }catch(e){return true}
  });
}

/* ---- material counting ----
   A trade is not a sacrifice: Rxd5 Rxd5 leaves material level, so it must never look "brilliant". Everything
   below plays the capture sequences out (a capture-only search with recaptures, evasions when in check). */
const MAT={p:1,n:3,b:3,r:5,q:9};
function materialBalance(ch,color){let t=0;for(const row of ch.board())for(const p of row)if(p&&p.type!=='k')t+=(p.color===color?1:-1)*MAT[p.type];return t}
// What the side to move nets (+) or loses (-) once the captures are over. bal = its material lead right now.
function qsearch(ch,alpha,beta,bal,depth,budget){
  const chk=ch.in_check();
  let best=chk?-1000:bal;                              // standing pat isn't allowed while in check
  if(best>=beta)return best;
  if(best>alpha)alpha=best;
  if(depth<=0||budget.n<=0)return bal;
  let ms=ch.moves({verbose:true});
  if(chk&&!ms.length)return -100;                      // checkmated
  if(!chk)ms=ms.filter(m=>m.captured||m.promotion==='q');
  ms.sort((a,b)=>((MAT[b.captured]||0)*10-PV[b.piece])-((MAT[a.captured]||0)*10-PV[a.piece]));
  for(const m of ms){
    budget.n--;
    const gain=(MAT[m.captured]||0)+(m.promotion==='q'?8:0);
    ch.move({from:m.from,to:m.to,promotion:m.promotion});
    const sc=-qsearch(ch,-beta,-alpha,-(bal+gain),depth-1,budget);
    ch.undo();
    if(sc>best)best=sc;
    if(best>alpha)alpha=best;
    if(alpha>=beta)break;
  }
  return best;
}
const MATC=new Map();
// gain: material the mover could have cashed in at once (hanging pieces) · lost: how far below that the played move ends up.
function matInfo(i,mv){
  const fb=S.fens[i-1],fa=S.fens[i],key=fb+'>'+uciOf(mv);
  if(MATC.has(key))return MATC.get(key);
  const b=new Chess(fb),a=new Chess(fa),bal0=materialBalance(b,mv.color);
  const base=qsearch(b,-1000,1000,bal0,8,{n:1500});
  const after=-qsearch(a,-1000,1000,-materialBalance(a,mv.color),8,{n:1500});
  const r={gain:base-bal0,lost:base-after};
  MATC.set(key,r);return r;
}
// Rescue: the engine's best move is the only one that stops a lost position from staying lost.
function isRescue(A,sg,before,after){
  return CFG.rescue&&before<=CFG.rescueBefore&&after>=CFG.rescueAfter&&A.length>1&&sg*A[1].v<=CFG.rescueAlt;
}

/* ---- move quality (point loss) ---- */
function pointQuality(A0,B0,sg,s,isBest){
  const pm=A0.mate!=null,cm=B0.mate!=null;
  const L=CFG.loss;
  if(pm&&cm){                                   // mate -> mate
    const pS=sg*A0.mate,cS=sg*B0.mate;
    if(pS>0&&cS<0)return cS<-5?'mistake':'blunder';
    const mateLoss=(B0.mate-A0.mate)*sg;
    if(mateLoss<0||(mateLoss===0&&cS<0))return 'best';
    if(mateLoss<2)return 'excellent';
    if(mateLoss<7)return 'good';
    return 'inaccuracy';
  }
  if(pm&&!cm){                                  // mate -> centipawn
    const c=sg*B0.v*100;
    if(c>=800)return 'excellent';
    if(c>=400)return 'good';
    if(c>=200)return 'inaccuracy';
    return c>=100?'mistake':'blunder';
  }
  if(!pm&&cm){                                  // centipawn -> mate
    const cS=sg*B0.mate;
    if(cS>0)return 'best';
    if(cS>=-2)return 'blunder';
    if(cS>=-5)return 'mistake';
    return 'inaccuracy';
  }
  if(isBest)return 'best';                      // centipawn -> centipawn
  const loss=Math.max(0,epMover(A0,sg)-epMover(B0,sg));
  if(loss<L.best*s)return 'best';
  if(loss<L.excellent*s)return 'excellent';
  if(loss<L.good*s)return 'good';
  if(loss<L.inacc*s)return 'inaccuracy';
  if(loss<L.mistake*s)return 'mistake';
  return 'blunder';
}

/* ---- critical (Great) and brilliant ---- */
function criticalCandidate(i,A,B,mv,sg){
  const alt=A.length>1?sg*A[1].v:sg*B[0].v;
  if(alt>=CFG.overwhelming)return false;        // already overwhelmingly winning
  if(sg*B[0].v<0)return false;                  // losing after the move
  if(mv.promotion==='q')return false;
  if(new Chess(S.fens[i-1]).in_check())return false;
  return true;
}
function moverMates(B0,sg){return B0.mate!=null&&(B0.mate===0?sg*B0.v>0:sg*B0.mate>0)}
function isCritical(i,A,B,mv,sg,s){
  if(!criticalCandidate(i,A,B,mv,sg))return false;
  if(moverMates(B[0],sg))return false;
  const pm=S.moves[i-2];
  if(mv.captured&&pm&&pm.captured&&pm.to===mv.to)return false;   // a plain recapture is not a find
  if(mv.captured){                              // taking a hanging piece is not critical
    const opp=sg>0?'b':'w';
    if(unsafePieces(S.fens[i-1],opp).some(u=>u.square===mv.to))return false;
  }
  if(A.length<2)return false;
  return epMover(A[0],sg)-epMover(A[1],sg)>=CFG.greatGap/s;
}
function isBrilliant(i,A,B,mv,sg){
  if(!criticalCandidate(i,A,B,mv,sg)||mv.promotion)return false;
  if(sg*B[0].v<CFG.brillMinEval)return false;          // must leave you clearly better
  if(sg*A[0].v>=CFG.brillMaxBefore)return false;       // already crushing: nothing brilliant about it
  return matInfo(i,mv).lost>=CFG.brillSac;             // material counting: it has to give something up
}

function classify(i){
  const mv=S.moves[i-1],sg=mv.color==='w'?1:-1;
  const A=S.P[i-1],B=S.P[i];
  const have=!!(A&&B&&A.length&&B.length);
  const s=CFG.strict,clampv=x=>Math.max(-10,Math.min(10,x));
  const before=have?clampv(sg*A[0].v):0,after=have?clampv(sg*B[0].v):0;
  const played=uciOf(mv),isBest=have&&A[0].pv[0]===played;
  const res=(k,extra)=>Object.assign({k,before,after,best:have?A[0]:null},extra);

  // Book
  if(S.book){
    const b=S.book[i];
    if(b&&b.book)return res('book',{opening:b.opening});
  }else if(S.bookOK){
    const seq=S.moves.slice(0,i).map(m=>m.san.replace(/[+#]/g,''));
    if(BOOK.some(l=>l.length>=seq.length&&seq.every((x,k)=>l[k]===x)))return res('book');
    S.bookOK=false;
  }
  if(!have)return null;
  // Forced / mate delivered
  if(new Chess(S.fens[i-1]).moves().length===1)return res('forced');
  if(B[0].mate===0&&sg*B[0].v>0)return res('best');

  let q=pointQuality(A[0],B[0],sg,s,isBest);

  // Special classes only replace a best/excellent move
  if(q==='best'||q==='excellent'){
    if(isBrilliant(i,A,B,mv,sg))return res('brilliant');
    if(isBest&&isCritical(i,A,B,mv,sg,s))return res('great');
    if(isBest&&isRescue(A,sg,before,after))return res('great');
  }
  if(q==='best')return res('best');

  // Miss: the opponent slipped, an advantage was there, and it wasn't taken
  const prev=S.cls[i-1];
  const prevErr=prev&&['inaccuracy','mistake','blunder','miss'].includes(prev.k);
  if(prevErr&&['good','inaccuracy','mistake'].includes(q)&&sg*A[0].v>=CFG.missBefore
     &&sg*B[0].v<=CFG.missAfter&&sg*B[0].v>=CFG.missLow)return res('miss');

  // Miss: a forced mate was on the board and this move let it go (the position is still fine, otherwise it's a mistake)
  if(CFG.missMate&&A[0].mate!=null&&sg*A[0].mate>0&&!(B[0].mate!=null&&sg*B[0].mate>0)&&['good','inaccuracy'].includes(q))return res('miss');
  // Miss: the opponent's last move left material hanging and this move didn't collect it
  if(CFG.missHung&&prevErr&&['good','inaccuracy','mistake'].includes(q)){
    const m=matInfo(i,mv);if(m.gain>=2&&m.lost>=2)return res('miss');
  }

  // Leniency: a top-3 engine move that still leaves you better is never worse than Excellent
  if(CFG.leniency&&['inaccuracy','mistake','blunder'].includes(q)
     &&A.some(l=>l.pv[0]===played)&&sg*A[0].v>0&&sg*B[0].v>=CFG.keepAdv)q='excellent';
  // Decisive advantage: converting a won game isn't punished for taking the slow route
  if(CFG.decisive&&['inaccuracy','mistake','blunder'].includes(q)&&before>=CFG.decisiveFrom&&after>=CFG.decisiveKeep)q='good';
  return res(q);
}
// Manual classification (set from the move list's context menu) wins over the engine's verdict.
function withOver(i,r){
  const k=S.over[i];if(!k)return r;
  return Object.assign({before:0,after:0,best:null},r,{k,custom:true,opening:k==='book'&&r?r.opening:undefined});
}
function classifyAll(){
  S.bookOK=!S.startFen;S.cls=[];
  // classify() copes with missing data itself (book moves need none, and it returns null otherwise),
  // so don't pre-filter on S.P: book moves are never searched and would lose their icons.
  for(let i=1;i<S.fens.length;i++){const r=withOver(i,classify(i));if(r)S.cls[i]=r}
}

/* ---------- Render: board ---------- */
function iconNode(k,cls){
  const d=document.createElement('span');d.className=cls;
  const img=new Image();img.alt=CLS[k].label;img.src=ICON_URL(k);
  img.onerror=()=>{const f=document.createElement('i');f.style.background=CLS[k].color;f.textContent=CLS[k].sym;d.replaceChildren(f)};
  d.appendChild(img);return d;
}
function render(){
  const pv=S.preview,fen=pv?pv.fen:S.fens[S.idx];
  const ch=new Chess(fen),board=ch.board();
  const lm=(S.sel&&!pv)?ch.moves({verbose:true}).filter(m=>m.from===S.sel):[];
  const c=S.idx>0&&!pv?S.cls[S.idx]:null,mv=S.idx>0?S.moves[S.idx-1]:null;
  let from=null,to=null;
  if(pv){from=pv.from;to=pv.to}else if(mv){from=mv.from;to=mv.to}
  const el=$('board');el.replaceChildren();

  let anim=null;
  if(!pv&&!S.rPrev&&S.rIdx!==undefined&&S.rLine===S.line&&Math.abs(S.idx-S.rIdx)===1){
    const m=S.moves[Math.max(S.idx,S.rIdx)-1],fw=S.idx>S.rIdx;
    anim=fw?{from:m.from,to:m.to}:{from:m.to,to:m.from};
  }
  S.rIdx=S.idx;S.rPrev=S.preview;S.rLine=S.line;
  const colOf=n=>{const f='abcdefgh'.indexOf(n[0]),r=8-(+n[1]);return[S.flip?7-f:f,S.flip?7-r:r]};
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){
    const rr=S.flip?7-r:r,ff=S.flip?7-f:f;
    const name='abcdefgh'[ff]+(8-rr),p=board[rr][ff];
    const sq=document.createElement('div');
    sq.className='sq '+((rr+ff)%2===0?'l':'d');

    if(tgt)sq.classList.add(tgt.captured||tgt.flags.includes('e')?'cap':'dot');
    sq.onclick=ev=>onSquare(name,ev);
    if(c&&(name===from||name===to)){const h=document.createElement('div');h.className='hl';h.style.background=CLS[c.k].color;if(fresh)h.classList.add('fade');sq.appendChild(h)}
    else if(!c&&(name===from||name===to)){const h=document.createElement('div');h.className='hl';h.style.background='#7aa6ff';h.style.opacity='.35';if(fresh)h.classList.add('fade');sq.appendChild(h)}
    if(f===0){const t=document.createElement('span');t.className='co r';t.textContent=8-rr;sq.appendChild(t)}
    if(r===7){const t=document.createElement('span');t.className='co f';t.textContent='abcdefgh'[ff];sq.appendChild(t)}
    if(p){
      const img=new Image();img.className='pc';img.draggable=false;img.alt=p.color+p.type;
      img.src=PIECE_URL(p.color,p.type.toUpperCase());
      img.onerror=()=>{img.remove();const s=document.createElement('div');s.className='pc-fb';s.textContent={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}[p.type];sq.appendChild(s)};
      sq.appendChild(img);
      if(anim&&name===anim.to){
        const a=colOf(anim.from),b=colOf(anim.to);

        requestAnimationFrame(()=>requestAnimationFrame(()=>{img.classList.add('sliding');img.style.transform=''}));
      }
    }
    if(c&&name===to){const bd=iconNode(c.k,'badge');if(fresh)bd.classList.add('pop');sq.appendChild(bd)}
    el.appendChild(sq);
  }
  document.querySelectorAll('.mvbtn').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.idx&&+b.dataset.l===S.line.id));
  keepActiveVisible();
  renderVerdict(c,mv);
  if(fresh){const v=$('verdict');v.classList.remove('rise');void v.offsetWidth;v.classList.add('rise')}
  renderBar();updateCursor();
}
function keepActiveVisible(){ // scroll only the move list, never the page
  const box=$('moves'),a=box.querySelector('.mvbtn.on');if(!a)return;
  const top=a.offsetTop,bot=top+a.offsetHeight;
  if(top<box.scrollTop)box.scrollTop=top-4;
  else if(bot>box.scrollTop+box.clientHeight)box.scrollTop=bot-box.clientHeight+4;
}
function renderVerdict(c,mv){
  const v=$('verdict');v.replaceChildren();
  if(S.preview){v.textContent='Previewing engine line. Use ← → to return to the game.';return}
  if(!mv){v.textContent=S.moves.length?'Start position':'Paste a PGN and press Analyze.';return}
  if(!c){v.textContent=mv.san+(S.line.todo.includes(S.idx)?' · classifying…':'');return}
  const ic=iconNode(c.k,'');ic.style.cssText='width:26px;height:26px;display:block';v.appendChild(ic);
  const t=document.createElement('div');

  if(['inaccuracy','mistake','blunder','miss','good','excellent'].includes(c.k)&&c.best&&c.best.pv[0]){
    const bs=pvToSan(S.fens[S.idx-1],[c.best.pv[0]],1)[0];

  if(c.custom)txt+=' · <i>edited</i>';
  t.innerHTML=txt;v.appendChild(t);
}
function curLines(){return S.live||S.P[S.idx]||[]}
function renderBar(){

function moveBtn(L,ply,label){

/* ---------- Accuracy ----------
   Same idea as Lichess: win% before and after each move -> a per-move accuracy, then a volatility-weighted
   mean blended with the harmonic mean so that a few big mistakes pull the score down properly. */
function lineWin(l){   // white's winning chances, 0-100
  if(l.mate!=null)return l.mate===0?(l.v>0?100:0):(l.mate>0?100:0);
  const cp=Math.max(-1000,Math.min(1000,l.v*100));
  return 50+50*(2/(1+Math.exp(-0.00368208*cp))-1);
}
function gameAccuracy(L){
  const n=L.moves.length,W=[];
  for(let i=0;i<=n;i++)W[i]=L.P[i]&&L.P[i].length?lineWin(L.P[i][0]):null;
  const first=W.find(x=>x!=null);
  for(let i=0;i<=n;i++)if(W[i]==null)W[i]=i===0||W[i-1]==null?(first==null?50:first):W[i-1];
  const win=Math.max(2,Math.min(8,Math.floor(n/10))),data={w:[],b:[]};
  for(let i=1;i<=n;i++){
    const m=L.moves[i-1],c=L.cls[i];
    const hasData=L.P[i-1]&&L.P[i-1].length&&L.P[i]&&L.P[i].length;
    let a;
    if(c&&c.k==='book'&&!hasData)a=100;
    else if(!hasData)continue;
    else{
      const sg=m.color==='w'?1:-1,wb=sg>0?W[i-1]:100-W[i-1],wa=sg>0?W[i]:100-W[i];
      a=Math.max(0,Math.min(100,103.1668*Math.exp(-0.04354*Math.max(0,wb-wa))-3.1669+1));
    }
    const lo=Math.max(0,i-Math.floor(win/2)),hi=Math.min(n,i+Math.ceil(win/2)),seg=W.slice(lo,hi+1);
    const mean=seg.reduce((x,y)=>x+y,0)/seg.length,sd=Math.sqrt(seg.reduce((x,y)=>x+(y-mean)*(y-mean),0)/seg.length);
    data[m.color].push({a,w:Math.max(.5,Math.min(12,sd))});
  }
  const out={W};
  for(const col of ['w','b']){
    const d=data[col];
    if(!d.length){out[col]=null;continue}
    const sw=d.reduce((x,y)=>x+y.w,0),wm=d.reduce((x,y)=>x+y.a*y.w,0)/sw,hm=d.length/d.reduce((x,y)=>x+1/Math.max(y.a,1),0);

}

/* ---------- PGN parsing (handles chess.com / lichess exports) ---------- */
// Strips clock comments, {comments}, ;comments, (variations), $NAGs, !? marks, move numbers and results,
// then plays the moves one by one so odd formatting can't break the parser.
function parsePgn(text){
  let t=text.replace(/\r/g,'');
  const second=t.search(/\n\s*\n\s*\[Event /);if(second>0)t=t.slice(0,second);
  const headers={};
  t=t.replace(/\[\s*(\w+)\s+"([^"]*)"\s*\]/g,(m,k,v)=>{headers[k]=v;return ' '});
  t=t.replace(/\{[^}]*\}/g,' ').replace(/;[^\n]*/g,' ');
  let prev;do{prev=t;t=t.replace(/\([^()]*\)/g,' ')}while(t!==prev);
  t=t.replace(/\$\d+/g,' ').replace(/…/g,'...').replace(/0-0-0/g,'O-O-O').replace(/0-0/g,'O-O');
  t=t.replace(/(^|\s)(1\s*-\s*0|0\s*-\s*1|1\/2\s*-\s*1\/2|\*)(?=\s|$)/g,' ');
  t=t.replace(/\b\d+\s*\.(\s*\.\.)?/g,' ');
  const toks=t.split(/\s+/).map(x=>x.replace(/[!?]+$/,'')).filter(x=>x&&!/^\.+$/.test(x)&&x!=='--');
  const g=new Chess();
  let startFen;
  if(headers.FEN){
    if(!g.load(headers.FEN))return{error:'The FEN header in this PGN is not valid.'};
    if(headers.FEN.split(' ').slice(0,4).join(' ')!==new Chess().fen().split(' ').slice(0,4).join(' '))startFen=g.fen();
  }
  for(let k=0;k<toks.length;k++){
    if(!g.move(toks[k],{sloppy:true}))return{error:`Illegal or unreadable move "${toks[k]}" (move ${k+1}).`};
  }
  return{moves:g.history({verbose:true}),startFen,headers};
}
function loadPgn(){
  const r=parsePgn($('pgn').value);
  if(r.error){setStatus(r.error);return false}
  if(!r.moves.length){setStatus('No moves found in PGN.');return false}
  S.lines=[MAIN];S.line=MAIN;S.sel=null;MAIN.todo=[];
  const key=r.moves.map(m=>m.san).join(' ')+'|'+(r.startFen||'');
  if(key!==S.pgnKey){S.over={};S.pgnKey=key}
  S.headers=r.headers||{};MATC.clear();
  S.run++;S.moves=r.moves;S.startFen=r.startFen;S.P=[];S.cls=[];S.book=null;S.live=null;S.preview=null;S.done=false;
  S.bookOK=!r.startFen;S.idx=0;S.nextCls=1;
  const rep=new Chess(r.startFen);S.fens=[rep.fen()];
  r.moves.forEach(m=>{rep.move({from:m.from,to:m.to,promotion:m.promotion});S.fens.push(rep.fen())});
  for(const i in S.over)S.cls[i]=withOver(+i,null);
  renderMoves();render();renderLines();$('summaryCard').hidden=true;
  setStatus(`${r.moves.length} moves loaded.`);
  return true;
}

/* ---------- Navigation, variations & live analysis ----------
   Every line (the game plus each variation) is a full move list with its own evaluations and classifications.
   S.line is the line on screen; S.moves / S.fens / S.P / S.cls always refer to it. */
function go(i){
  let L=S.line;i=Math.max(0,Math.min(L.moves.length,i));
  while(L.parent&&i<=L.fork)L=L.parent;          // stepping back past a fork returns to the parent line

  if(i<L.moves.length&&uciOf(L.moves[i])===u){go(i+1);return}                        // already in this line
  const same=S.lines.find(X=>X!==L&&X.moves.length>i&&uciOf(X.moves[i])===u&&prefixEq(X,L,i));
  if(same){showLine(same,i+1);return}                                                  // already in another variation
  const c=new Chess(L.fens[i]);c.move({from:mv.from,to:mv.to,promotion:mv.promotion});
  let T=L;
  if(i<L.moves.length){                                                                // branch off
    T=newLine({parent:L,fork:i,startFen:L.startFen,moves:L.moves.slice(0,i),fens:L.fens.slice(0,i+1),
               P:L.P.slice(0,i+1),cls:L.cls.slice(0,i+1)});
    for(const k in L.over)if(+k<=i)T.over[k]=L.over[k];

  }
  T.moves.push(mv);T.fens.push(c.fen());T.todo.push(T.moves.length);
  if(!T.startFen&&OPEN.ok)computeBook(T);
  S.rLine=T;S.rIdx=i;                                                                  // so the move slides in

  S.lines=S.lines.filter(Y=>!dead.has(Y));

}

    if(c.length){if(c[0].promotion){askPromo(ev,c);return}S.sel=null;playMove(c[0]);return}
  }

}
function askPromo(ev,cands){

    const b=document.createElement('button');b.type='button';b.className='ctx-i';b.textContent=l;

  });
  m.hidden=false;
  m.style.left=Math.max(8,Math.min(ev.clientX,innerWidth-m.offsetWidth-8))+'px';
  m.style.top=Math.max(8,Math.min(ev.clientY,innerHeight-m.offsetHeight-8))+'px';
}

/* Classify moves played in variations (or appended to the game) with a separate engine. */
let AUX=null,auxChain=Promise.resolve();
function queueLine(X){if(S.batch)return;auxChain=auxChain.then(()=>runLine(X)).catch(()=>{})}
function flushLines(){S.lines.forEach(X=>{if(X.todo.length)queueLine(X)})}
async function runLine(X){
  if(!S.lines.includes(X)||!X.todo.length)return;
  if(!AUX)AUX=new Engine();
  await AUX.readyP;
  while(X.todo.length&&S.lines.includes(X)&&!S.batch){
    const k=X.todo[0];
    let r=withLine(X,()=>withOver(k,classify(k)));
    if(!r){
      for(const j of [k-1,k]){
        if(X.P[j]&&X.P[j].length)continue;
        let lines=terminal(X.fens[j]);
        if(!lines&&CFG.partial&&j>0&&X.P[j-1])lines=withLine(X,()=>derive(j));
        if(!lines){ // search the new position about as deep as the one before it, so the two evaluations are comparable
          const dA=j===k?((X.P[k-1]&&X.P[k-1][0]&&X.P[k-1][0].depth)||0):0;
          const res=await AUX.search(X.fens[j],Math.min(18,Math.max(CFG.depth,dA)));lines=res.lines}
        if(!S.lines.includes(X))return;
        X.P[j]=lines;
        if(S.line===X&&S.idx===j){renderBar();renderLines()}
      }
      r=withLine(X,()=>withOver(k,classify(k)));
    }
    X.todo.shift();
    if(r)X.cls[k]=r;
    renderMoves();if(S.line===X)render();
    if(X===MAIN&&S.done&&!$('summaryCard').hidden)renderSummary();
  }
}

/* Live analysis: only for positions that have no stored analysis yet (before the game is analysed, or in a
   variation). Once the game is analysed, every position is improved by the game-wide deepening passes instead. */
async function liveAnalyze(){
  const L=S.line,idx=S.idx,fen=S.fens[idx];
  const T=terminal(fen);
  if(T){S.live=T;renderBar();renderLines();return}
  if(L.P[idx]&&L.P[idx].length)return;
  if(S.batch||S.deep){                               // the main engines are busy: use the spare one, queued behind variation work
    const tok=++S.token;
    auxChain=auxChain.then(async()=>{
      if(tok!==S.token||(L.P[idx]&&L.P[idx].length))return;
      if(!AUX)AUX=new Engine();
      await AUX.readyP;
      const r=await AUX.search(fen,CFG.depth,lines=>{if(tok===S.token&&lines.length){S.live=lines;renderBar();renderLines()}});
      if(!r.stopped&&r.lines.length&&!(L.P[idx]&&L.P[idx].length)){L.P[idx]=r.lines;if(tok===S.token){S.live=null;renderBar();renderLines()}}
    }).catch(()=>{});
    return;
  }
  const eng=POOL[0];if(!eng||!eng.ready)return;
  const tok=++S.token;
  const r=await eng.search(fen,CFG.depth,lines=>{
    if(tok!==S.token||!lines.length)return;
    S.live=lines;renderBar();renderLines();
  });
  if(tok===S.token&&!r.stopped&&r.lines.length){L.P[idx]=r.lines;S.live=null;renderBar();renderLines()}
}

/* ---------- Game analysis ---------- */
function bookLength(){ // how many leading moves are book (those positions need no engine search)
  if(S.startFen)return 0;
  if(S.book){let k=0;while(S.book[k+1]&&S.book[k+1].book)k++;return k}
  const seq=S.moves.map(m=>m.san.replace(/[+#]/g,''));
  let k=0;
  while(k<seq.length&&BOOK.some(l=>l.length>k&&seq.slice(0,k+1).every((x,j)=>l[j]===x)))k++;
  return k;
}
// Partial analysis: if the played move is one of the engine's lines, the next position's evaluation and
// best reply are already in that line's PV, so no new search is needed.
function derive(i){
  const A=S.P[i-1],mv=S.moves[i-1];if(!A||!A.length)return null;
  const played=uciOf(mv),L=A.find(l=>l.pv[0]===played);
  if(!L||L.pv.length<2)return null;
  const sg=mv.color==='w'?1:-1,m=L.mate;
  let nm=null,v=L.v;
  if(m!=null){nm=sg*m>0?m-sg:m;v=(nm>0?1:-1)*(50-Math.min(Math.abs(nm),49))}
  return[{v,mate:nm,pv:L.pv.slice(1),depth:Math.max(1,(L.depth||CFG.depth)-1),partial:true}];
}
function advance(){ // classify moves in order as soon as their data exists
  let ch=false;
  while(S.nextCls<S.fens.length){
    const r=withOver(S.nextCls,classify(S.nextCls));if(!r)break;
    S.cls[S.nextCls++]=r;ch=true;
  }
  return ch;
}
/* Pause / resume for the whole-game passes. A halted search comes back "stopped" and is simply retried. */
const waiters=[];
const resumeAll=()=>{while(waiters.length)waiters.pop()()};
async function searchGate(w,fen,depth,run){
  for(;;){
    if(S.run!==run)return null;
    if(S.paused){await new Promise(r=>waiters.push(r));continue}
    const r=await w.search(fen,depth);
    if(S.run!==run)return null;
    if(!r.stopped)return r.lines;
  }
}
function syncPause(){const on=S.batch||S.deep;$('bPause').hidden=!on;$('bPause').textContent=S.paused?'▶ Resume':'⏸ Pause'}
const bookNote=()=>'Book: '+(S.bookSrc==='openings'?'openings.txt':'built-in list (openings.txt not found)');
async function analyze(){
  if(S.batch)return;
  if(!POOL[0]||!POOL[0].ready){setStatus('Engine is still loading…');return}
  S.paused=false;resumeAll();S.deep=false;
  if(!loadPgn())return;
  const run=++S.run;S.batch=true;$('bAnalyze').disabled=true;syncPause();
  if(matchMedia('(max-width:980px)').matches)$('pgnCard').open=false;
  setStatus('Checking opening book…');
  const M=MAIN;
  await fetchBook(M);
  const n=M.fens.length,bl=withLine(M,bookLength),start=Math.min(bl,n-1),total=n-start;
  const nW=Math.max(1,Math.min(workerCount(),total));
  const pool=getPool(nW);await Promise.all(pool.map(e=>e.readyP));
  let done=0;
  withLine(M,advance);renderMoves();render();
  async function segment(w,a,b){
    for(let i=a;i<=b;i++){
      if(S.run!==run)return;
      let lines=terminal(M.fens[i]);
      if(!lines&&CFG.partial&&i>a)lines=withLine(M,()=>derive(i));
      if(!lines){lines=await searchGate(w,M.fens[i],CFG.depth,run);if(lines===null)return}
      if(S.run!==run)return;
      M.P[i]=lines;done++;
      $('prog').style.width=(done/total*100)+'%';
      setStatus(`Analyzing… ${done}/${total}`+(nW>1?` · ${nW} workers`:''));
      const had=S.line===M?M.cls[S.idx]:null;
      if(withLine(M,advance))renderMoves();
      if(S.line===M&&(i===S.idx||M.cls[S.idx]!==had)){render();renderLines()}   // keep the current view up to date
    }
  }
  const size=Math.ceil(total/nW),jobs=[];
  for(let k=0;k<nW;k++){const a=start+k*size,b=Math.min(n-1,a+size-1);if(a<=b)jobs.push(segment(pool[k],a,b))}
  await Promise.all(jobs);
  if(S.run!==run)return;
  S.batch=false;$('bAnalyze').disabled=false;
  withLine(M,classifyAll);M.nextCls=M.fens.length;S.done=true;
  setStatus('Analysis complete at depth '+CFG.depth+'. '+bookNote()+'.');
  renderMoves();renderSummary();render();renderLines();flushLines();
  $('prog').style.width='0';syncPause();
  deepen(run);liveAnalyze();                          // (book positions have no stored search yet)
}

/* Whole-game iterative deepening: when the analysis is done, search the game again from the first position to
   the last at depth+1, re-classify, then do it again at depth+2, and so on until the max depth or you pause.
   Classifications are only recomputed once a pass is complete, so every move is judged on evaluations of the same depth. */
async function deepen(run){
  const M=MAIN;
  if(!CFG.deepen||CFG.depth>=CFG.maxDepth||S.run!==run)return;
  S.deep=true;syncPause();
  const nW=Math.max(1,Math.min(workerCount(),M.fens.length)),pool=getPool(nW);
  await Promise.all(pool.map(e=>e.readyP));
  const todo=[];for(let i=0;i<M.fens.length;i++)if(M.P[i]&&M.P[i].length&&!terminal(M.fens[i]))todo.push(i);
  let d=CFG.depth;                                  // deepest depth that has been completed for the whole game
  while(S.run===run&&S.deep&&d<CFG.maxDepth&&todo.length){
    const nd=d+1;let next=0,done=0;
    const tell=()=>{$('prog').style.width=(done/todo.length*100)+'%';setStatus(`Deepening to depth ${nd}… ${done}/${todo.length}`+(S.paused?' (paused)':''))};
    tell();
    await Promise.all(pool.map(async w=>{
      while(S.run===run&&S.deep){
        const j=next++;if(j>=todo.length)return;
        const i=todo[j],lines=await searchGate(w,M.fens[i],nd,run);
        if(lines===null)return;
        if(lines.length)M.P[i]=lines;
        done++;tell();
        if(S.line===M&&S.idx===i&&!S.preview){S.live=null;renderBar();renderLines()}
      }
    }));
    if(S.run!==run||!S.deep)break;                  // cancelled mid-pass: keep the last complete classification
    d=nd;
    withLine(M,classifyAll);                       // the pass is complete: re-judge every move
    renderMoves();renderSummary();render();renderLines();
    $('prog').style.width='0';
  }
  if(S.run!==run)return;
  $('prog').style.width='0';
  S.deep=false;S.paused=false;syncPause();
  setStatus(`Analysis complete at depth ${d}. ${bookNote()}.`);
  liveAnalyze();
}

/* ---------- Events ---------- */
$('bAnalyze').onclick=analyze;
$('selDepth').onchange=e=>{CFG.depth=+e.target.value};
$('chkPartial').onchange=e=>{CFG.partial=e.target.checked};
$('pgn').onchange=()=>{if(!S.batch)loadPgn()};
$('selStrict').onchange=e=>{
  CFG.strict=+e.target.value;
  if(S.batch)return;
  S.lines.forEach(L=>{if(L.P.length>=2)withLine(L,classifyAll)});renderMoves();if(!$('summaryCard').hidden)renderSummary();render();
};
$('bStart').onclick=()=>go(0);
$('bPrev').onclick=()=>go(S.idx-1);
$('bNext').onclick=()=>go(S.idx+1);
$('bEnd').onclick=()=>go(S.moves.length);
$('bPause').onclick=()=>{
  S.paused=!S.paused;syncPause();
  if(S.paused){POOL.forEach(e=>e.halt());setStatus('Paused.')}else resumeAll();
};
$('chkDeepen').onchange=e=>{CFG.deepen=e.target.checked;if(!CFG.deepen&&S.deep){S.deep=false;S.paused=false;resumeAll();syncPause();setStatus('Stopped deepening.')}};
$('selMax').onchange=e=>{CFG.maxDepth=+e.target.value};
$('selEngine').onchange=()=>{        // switch engines: throw the old workers away and start over
  S.run++;S.batch=false;S.deep=false;S.paused=false;resumeAll();$('bAnalyze').disabled=false;$('prog').style.width='0';syncPause();
  POOL.splice(0).forEach(e=>e.kill());if(AUX){AUX.kill();AUX=null}
  ENG.wasmOK=null;ENG.probe=null;setStatus('Loading engine…');
  getPool(1);POOL[0].readyP.then(()=>{if(!S.batch&&!S.deep)setStatus('Engine ready ('+POOL[0].label+').')});
};
$('bFlip').onclick=()=>{S.flip=!S.flip;render()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA')return;
  if(e.key==='ArrowLeft')go(S.idx-1);
  else if(e.key==='ArrowRight')go(S.idx+1);
  else if(e.key==='ArrowUp')go(0);
  else if(e.key==='ArrowDown')go(S.moves.length);
  else if(e.key==='f'||e.key==='F'){S.flip=!S.flip;render()}
});

buildThemes();loadOpenings();
S.fens=[new Chess().fen()];render();
getPool(1);
POOL[0].readyP.then(()=>{if(!S.batch&&!S.deep)setStatus('Engine ready ('+POOL[0].label+').')});
loadPgn();
</script>
